plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.callnotification'
version = '0.1.0'

android {
  namespace "expo.modules.callnotification"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // NotificationCompat.CallStyle needs androidx.core >= 1.7. This only sets a
  // floor — gradle resolves to the highest version in the app's graph.
  implementation 'androidx.core:core:1.13.1'
}
